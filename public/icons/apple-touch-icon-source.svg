<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="whitePiece" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#e8dcc2"/>
    </linearGradient>
    <linearGradient id="blackPiece" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#333"/>
      <stop offset="1" stop-color="#080808"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="#000000"/>
  <rect x="76" y="246" width="872" height="532" rx="43" fill="#ab7b40" filter="url(#shadow)"/>

  <!-- Homepage board cells: 8 columns by 4 rows. -->
  <g fill="#f0d095" stroke="#12100d" stroke-width="5">
    <!-- row 1: holes at columns 1, 2, and 8 -->
    <rect x="315" y="291" width="94" height="94" rx="2"/><rect x="415" y="291" width="94" height="94" rx="2"/>
    <rect x="515" y="291" width="94" height="94" rx="2"/><rect x="615" y="291" width="94" height="94" rx="2"/>
    <rect x="715" y="291" width="94" height="94" rx="2"/>
    <!-- row 2 -->
    <rect x="115" y="397" width="94" height="94" rx="2"/><rect x="215" y="397" width="94" height="94" rx="2"/>
    <rect x="315" y="397" width="94" height="94" rx="2"/><rect x="415" y="397" width="94" height="94" rx="2"/>
    <rect x="515" y="397" width="94" height="94" rx="2"/><rect x="615" y="397" width="94" height="94" rx="2"/>
    <rect x="715" y="397" width="94" height="94" rx="2"/><rect x="815" y="397" width="94" height="94" rx="2"/>
    <!-- row 3 -->
    <rect x="115" y="503" width="94" height="94" rx="2"/><rect x="215" y="503" width="94" height="94" rx="2"/>
    <rect x="315" y="503" width="94" height="94" rx="2"/><rect x="415" y="503" width="94" height="94" rx="2"/>
    <rect x="515" y="503" width="94" height="94" rx="2"/><rect x="615" y="503" width="94" height="94" rx="2"/>
    <rect x="715" y="503" width="94" height="94" rx="2"/><rect x="815" y="503" width="94" height="94" rx="2"/>
    <!-- row 4: holes at columns 1, 7, and 8 -->
    <rect x="215" y="609" width="94" height="94" rx="2"/><rect x="315" y="609" width="94" height="94" rx="2"/>
    <rect x="415" y="609" width="94" height="94" rx="2"/><rect x="515" y="609" width="94" height="94" rx="2"/>
    <rect x="615" y="609" width="94" height="94" rx="2"/>
  </g>

  <!-- Thin gameplay rails, matching the board. -->
  <g fill="#6a4625" stroke="#24170e" stroke-width="3">
    <rect x="312" y="282" width="500" height="8" rx="3"/>
    <rect x="212" y="705" width="500" height="8" rx="3"/>
  </g>
  <!-- Current board preview position. -->
  <g stroke="#4d3d25" stroke-width="7" filter="url(#shadow)">
    <circle cx="562" cy="338" r="35" fill="url(#whitePiece)"/>
    <rect x="325" y="407" width="74" height="74" rx="17" fill="url(#whitePiece)"/>
    <circle cx="462" cy="444" r="35" fill="url(#whitePiece)"/>
    <rect x="525" y="513" width="74" height="74" rx="17" fill="url(#whitePiece)"/>
    <rect x="425" y="619" width="74" height="74" rx="17" fill="url(#whitePiece)"/>
  </g>
  <g stroke="#f8f1e5" stroke-width="7" filter="url(#shadow)">
    <rect x="725" y="407" width="74" height="74" rx="17" fill="url(#blackPiece)"/>
    <rect x="325" y="513" width="74" height="74" rx="17" fill="url(#blackPiece)"/>
    <circle cx="462" cy="550" r="35" fill="url(#blackPiece)"/>
    <rect x="625" y="513" width="74" height="74" rx="17" fill="url(#blackPiece)"/>
    <circle cx="562" cy="656" r="35" fill="url(#blackPiece)"/>
  </g>
  <rect x="545" y="533" width="34" height="34" rx="5" fill="#d8493e" stroke="#731b16" stroke-width="5"/>
</svg>
